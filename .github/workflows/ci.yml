name: CI

on:
  pull_request:
    branches: [master, 'praca_*']
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Decides which services actually need to build/test/publish for this change. Every service
  # filter also matches contracts/**, Skarbiec.ServiceDefaults/** (+ its Sample project),
  # Skarbiec.Testing/** (+ its Sample project) and root build config, because every service
  # project-references those — a change there can break every service, not just the one whose
  # folder changed (ADR-002/003 keep services independent; these four are the exception).
  changes:
    name: Detect changed paths
    runs-on: self-hosted
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      portfolio: ${{ steps.filter.outputs.portfolio }}
      marketdata: ${{ steps.filter.outputs.marketdata }}
      strategy: ${{ steps.filter.outputs.strategy }}
      reporting: ${{ steps.filter.outputs.reporting }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      contracts: ${{ steps.filter.outputs.contracts }}
      servicedefaults: ${{ steps.filter.outputs.servicedefaults }}
      testinglib: ${{ steps.filter.outputs.testinglib }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'Skarbiec.slnx'
              - '.github/workflows/ci.yml'
            contracts:
              - *shared
              - 'contracts/**'
            servicedefaults:
              - *shared
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.ServiceDefaults.Sample/**'
            testinglib:
              - *shared
              - 'Skarbiec.Testing/**'
              - 'Skarbiec.Testing.Sample/**'
            identity:
              - *shared
              - 'contracts/**'
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'services/Identity/**'
            portfolio:
              - *shared
              - 'contracts/**'
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'services/Portfolio/**'
            marketdata:
              - *shared
              - 'contracts/**'
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'services/MarketData/**'
            strategy:
              - *shared
              - 'contracts/**'
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'services/Strategy/**'
            reporting:
              - *shared
              - 'contracts/**'
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'services/Reporting/**'
            gateway:
              - *shared
              - 'Skarbiec.ServiceDefaults/**'
              - 'Skarbiec.Testing/**'
              - 'gateway/**'
            web:
              - 'web/**'

  # Solution-wide formatting gate: only needs to run once, not once per service, and only when a
  # .NET project actually changed (a web-only PR gets nothing from re-running `dotnet format`).
  format:
    name: format
    needs: changes
    if: needs.changes.outputs.identity == 'true' || needs.changes.outputs.portfolio == 'true' || needs.changes.outputs.marketdata == 'true' || needs.changes.outputs.strategy == 'true' || needs.changes.outputs.reporting == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.servicedefaults == 'true' || needs.changes.outputs.testinglib == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Format check
        run: dotnet format Skarbiec.slnx --verify-no-changes

  # One job per microservice + the gateway: restore -> build (warnings-as-errors, via
  # Directory.Build.props) -> test (Testcontainers needs the Docker daemon the runner already has).
  # No Dockerfile build here — with no registry wired up yet, a `docker build` step only
  # duplicated the restore/publish work above (no BuildKit cache) for a rarely-tripped safety net.
  # Dockerfile validation + push arrives with the registry in T0.18 (deploy).
  #
  # These are separate named jobs, not a strategy.matrix, on purpose: a job-level `if:` cannot
  # reference the `matrix` context (only `needs`/`github`/`vars`/`inputs` are available there —
  # `matrix` only exists inside step-level `if:`), so `needs.changes.outputs[matrix.service]`
  # is invalid and GitHub rejects the whole workflow file. Separate jobs with a literal
  # `needs.changes.outputs.<name>` condition are the construct that actually makes an unaffected
  # service's job absent from the run, rather than merely no-op its steps.

  identity:
    name: identity
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/Identity/Skarbiec.Identity.Tests/Skarbiec.Identity.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build services/Identity/Skarbiec.Identity.Tests/Skarbiec.Identity.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test services/Identity/Skarbiec.Identity.Tests/Skarbiec.Identity.Tests.csproj --configuration Release --no-build

  portfolio:
    name: portfolio
    needs: changes
    if: needs.changes.outputs.portfolio == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/Portfolio/Skarbiec.Portfolio.Tests/Skarbiec.Portfolio.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build services/Portfolio/Skarbiec.Portfolio.Tests/Skarbiec.Portfolio.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test services/Portfolio/Skarbiec.Portfolio.Tests/Skarbiec.Portfolio.Tests.csproj --configuration Release --no-build

  marketdata:
    name: marketdata
    needs: changes
    if: needs.changes.outputs.marketdata == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/MarketData/Skarbiec.MarketData.Tests/Skarbiec.MarketData.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build services/MarketData/Skarbiec.MarketData.Tests/Skarbiec.MarketData.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test services/MarketData/Skarbiec.MarketData.Tests/Skarbiec.MarketData.Tests.csproj --configuration Release --no-build

  strategy:
    name: strategy
    needs: changes
    if: needs.changes.outputs.strategy == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/Strategy/Skarbiec.Strategy.Tests/Skarbiec.Strategy.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build services/Strategy/Skarbiec.Strategy.Tests/Skarbiec.Strategy.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test services/Strategy/Skarbiec.Strategy.Tests/Skarbiec.Strategy.Tests.csproj --configuration Release --no-build

  reporting:
    name: reporting
    needs: changes
    if: needs.changes.outputs.reporting == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/Reporting/Skarbiec.Reporting.Tests/Skarbiec.Reporting.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build services/Reporting/Skarbiec.Reporting.Tests/Skarbiec.Reporting.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test services/Reporting/Skarbiec.Reporting.Tests/Skarbiec.Reporting.Tests.csproj --configuration Release --no-build

  gateway:
    name: gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore gateway/Skarbiec.Gateway.Tests/Skarbiec.Gateway.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build gateway/Skarbiec.Gateway.Tests/Skarbiec.Gateway.Tests.csproj --configuration Release --no-restore

      - name: Test (Testcontainers — requires Docker)
        run: dotnet test gateway/Skarbiec.Gateway.Tests/Skarbiec.Gateway.Tests.csproj --configuration Release --no-build

  # Skarbiec.Contracts / Skarbiec.ServiceDefaults / Skarbiec.Testing are libraries, not deployable
  # services — no image, just their own test suite when they (or root build config) change.
  # Same reasoning as above for splitting into separate jobs instead of a strategy.matrix.

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore contracts/Skarbiec.Contracts.Tests/Skarbiec.Contracts.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build contracts/Skarbiec.Contracts.Tests/Skarbiec.Contracts.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test contracts/Skarbiec.Contracts.Tests/Skarbiec.Contracts.Tests.csproj --configuration Release --no-build

  servicedefaults:
    name: servicedefaults
    needs: changes
    if: needs.changes.outputs.servicedefaults == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Skarbiec.ServiceDefaults.Tests/Skarbiec.ServiceDefaults.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build Skarbiec.ServiceDefaults.Tests/Skarbiec.ServiceDefaults.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Skarbiec.ServiceDefaults.Tests/Skarbiec.ServiceDefaults.Tests.csproj --configuration Release --no-build

  testinglib:
    name: testinglib
    needs: changes
    if: needs.changes.outputs.testinglib == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Skarbiec.Testing.Tests/Skarbiec.Testing.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build Skarbiec.Testing.Tests/Skarbiec.Testing.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Skarbiec.Testing.Tests/Skarbiec.Testing.Tests.csproj --configuration Release --no-build

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test -- --watch=false
