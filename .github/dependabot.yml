version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ADR-012 pins MassTransit v8
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # On Quartz 4 since #149; the next major (5) may change the job API or the job-store schema again — take it deliberately, not as a bump
      - dependency-name: "Quartz*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/gateway/Skarbiec.Gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/Identity/Skarbiec.Identity"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/MarketData/Skarbiec.MarketData"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/Portfolio/Skarbiec.Portfolio"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/Reporting/Skarbiec.Reporting"
    schedule:
      interval: "weekly"
