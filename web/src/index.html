<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skarbiec</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Applies the resolved theme before first paint, so a hard reload never flashes the previous one.
      (function () {
        var theme = localStorage.getItem('skarbiec-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
