<button
  mat-icon-button
  type="button"
  [matMenuTriggerFor]="menu"
  [matTooltip]="'language.switch' | transloco"
  [attr.aria-label]="'language.switch' | transloco"
>
  <mat-icon>translate</mat-icon>
</button>
<mat-menu #menu="matMenu">
  @for (option of options; track option.id) {
    @let active = option.id === languageService.language();
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="active"
      [attr.lang]="option.id"
      (click)="select(option.id)"
    >
      <!-- An empty icon keeps both names aligned; only the active one shows the check. -->
      <mat-icon>{{ active ? 'check' : '' }}</mat-icon>
      <span>{{ option.name }}</span>
    </button>
  }
</mat-menu>
