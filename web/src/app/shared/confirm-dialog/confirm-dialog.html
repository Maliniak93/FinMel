<h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" cdkFocusInitial (click)="cancel()">
    {{ data.cancelLabel ?? ('common.cancel' | transloco) }}
  </button>
  <button
    mat-flat-button
    type="button"
    [class.confirm-dialog__confirm--destructive]="data.destructive"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? ('common.confirm' | transloco) }}
  </button>
</mat-dialog-actions>
