@if (rendered().length > 0) {
  <svg
    viewBox="0 0 36 36"
    class="pie-chart"
    role="img"
    [attr.aria-label]="'pieChart.ariaLabel' | transloco"
  >
    <g transform="rotate(-90 18 18)">
      @for (segment of rendered(); track segment.key) {
        <circle
          class="pie-chart__segment"
          [class.pie-chart__segment--dimmed]="selected() !== null && selected() !== segment.key"
          (click)="segmentClick.emit(segment.key)"
          cx="18"
          cy="18"
          [attr.r]="radius"
          fill="transparent"
          [attr.stroke]="segment.color"
          stroke-width="4"
          [attr.stroke-dasharray]="segment.dashArray"
          [attr.stroke-dashoffset]="segment.dashOffset"
        />
      }
    </g>
  </svg>
} @else {
  <p class="pie-chart__empty">{{ 'pieChart.empty' | transloco }}</p>
}
