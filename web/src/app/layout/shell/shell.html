<mat-sidenav-container class="shell">
  <mat-sidenav #drawer mode="side" opened class="shell__nav">
    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a mat-list-item [routerLink]="link.path" routerLinkActive="shell__nav-link--active">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label | transloco }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content-area">
    <mat-toolbar color="primary" class="shell__toolbar">
      <button
        mat-icon-button
        type="button"
        (click)="drawer.toggle()"
        [attr.aria-label]="'shell.toggleNavigation' | transloco"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span>Skarbiec</span>
      <span class="shell__spacer"></span>
      <button
        mat-icon-button
        type="button"
        (click)="cycleTheme()"
        [matTooltip]="themeLabel() | transloco"
        [attr.aria-label]="themeLabel() | transloco"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>
      <app-language-switch />
      <button
        mat-icon-button
        type="button"
        (click)="logout()"
        [attr.aria-label]="'shell.logOut' | transloco"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
