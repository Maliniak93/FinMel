<app-asset-basics-fields [group]="form.controls.basics" />

<div [formGroup]="form">
  <app-group-select formControlName="groupId" />
</div>

<app-instrument-picker
  [control]="form.controls.instrument"
  [nameControl]="form.controls.basics.controls.name"
  [assetClass]="assetClass()"
  [existingInstrumentId]="asset()?.instrumentId ?? instrumentId()"
/>

@if (!isEdit()) {
  <app-first-transaction-fields
    [group]="form.controls.initialTransaction"
    [currency]="currency()"
  />
}
