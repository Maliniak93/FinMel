<app-asset-basics-fields [group]="form.controls.basics" />

<p class="asset-form__hint">
  {{
    'assets.form.cashHint' | transloco: { currency: form.controls.basics.controls.currency.value }
  }}
</p>

  <app-first-transaction-fields
    [group]="form.controls.initialTransaction"
    [openingDeposit]="true"
  />
}
