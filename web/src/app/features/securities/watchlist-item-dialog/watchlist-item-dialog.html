<h2 mat-dialog-title>
  {{ (item ? 'securities.watchlist.editTitle' : 'securities.watchlist.addTitle') | transloco }}
</h2>

<form (submit)="submit($event)" novalidate>
  <mat-dialog-content class="watchlist-item-dialog__content">
    @if (item) {
      <p class="watchlist-item-dialog__instrument">{{ item.ticker }} — {{ item.name }}</p>
    } @else {
      <app-instrument-picker [control]="form.controls.instrument" [assetClass]="data.assetClass" />
    }

    <mat-form-field appearance="outline">
      <mat-label>{{ 'securities.watchlist.targetPrice' | transloco }}</mat-label>
      <input matInput type="number" min="0" step="any" [formControl]="form.controls.targetPrice" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'securities.watchlist.note' | transloco }}</mat-label>
      <textarea matInput rows="2" [formControl]="form.controls.note"></textarea>
    </mat-form-field>

    @if (formError()) {
      <p class="watchlist-item-dialog__error" role="alert">{{ formError() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ 'common.save' | transloco }}
      }
    </button>
  </mat-dialog-actions>
</form>
