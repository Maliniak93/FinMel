<h1 class="wealth__title">{{ 'shell.nav.wealth' | transloco }}</h1>

<nav
  mat-tab-nav-bar
  class="wealth__tabs"
  [tabPanel]="tabPanel"
  [attr.aria-label]="'wealth.tabsLabel' | transloco"
>
  @for (tab of tabs; track tab.path) {
    <a
      mat-tab-link
      #rla="routerLinkActive"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: tab.type === null }"
      [routerLink]="tab.path ? '/wealth/' + tab.path : '/wealth'"
      [active]="rla.isActive"
    >
      <span class="wealth__tab">
        <span class="wealth__tab-label">{{ tab.label | transloco }}</span>
        @if (tab.type === 'accounts') {
          @if (data.accountsLoaded()) {
            <span class="wealth__tab-caption sk-num">{{
              accountsCountKey() | transloco: { count: data.accountsCount() }
            }}</span>
          }
        } @else if (tab.type) {
          <span class="wealth__tab-caption sk-num">{{ sumCaption(tab.type) }}</span>
        }
      </span>
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet />
</mat-tab-nav-panel>
